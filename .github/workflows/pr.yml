# Pull request check -- one job: the helpers parse, and the image builds and
# passes `bootc container lint` (never pushed). Promotion PRs to main skip the
# build: develop already built the same commits. Publishing is release.yml only.
# The pull request policy is pr-policy.yml (it needs pull_request_target).
#
# Copyright 2026 Janghoon Lee (Redrob) and contributors. Apache-2.0.

name: pr

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck + py_compile
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends shellcheck
          sh=$( (find image -type f -name '*.sh'; grep -rlE '^#!/(usr/)?bin/(env )?(ba)?sh' image || true) | sort -u)
          # shellcheck disable=SC2086
          shellcheck -S warning $sh
          py=$(find tools -type f -name '*.py')
          # shellcheck disable=SC2086
          [ -z "$py" ] || python3 -m py_compile $py
      - name: Image build + bootc lint
        if: github.base_ref != 'main'
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          args=""
          while IFS= read -r line; do
            case "$line" in ''|'#'*) continue ;; esac
            args="$args --build-arg ${line}"
          done < image/base.env
          # shellcheck disable=SC2086
          podman build $args --build-arg GIT_SHA="${GITHUB_SHA}" -f image/Containerfile -t localhost/redrob-os:pr .
          podman run --rm localhost/redrob-os:pr bootc container lint
