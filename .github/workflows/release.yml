# Release -- tag `vX.Y.Z` on main -> versioned image -> installer media -> GitHub Release.
#
#   version   -> build amd64 / arm64 -> manifest + sign (ghcr.io/redrob-labs/redrob-os:X.Y.Z)
#             -> iso (amd64, anaconda-iso) / raw (arm64, raw disk) via bootc-image-builder
#             -> publish (SHA256SUMS + assets on the release)
#
# Assets:  redrob-os-<ver>-linux-x86_64.iso        Anaconda installer (disk install, dual boot, LUKS)
#          redrob-os-<ver>-linux-aarch64.img.xz    raw disk image for aarch64 boards (EXPERIMENTAL,
#                                                  the release is published without it if it fails)
#          SHA256SUMS
#
# `workflow_dispatch` with a version is a DRY RUN: it builds everything and publishes nothing.
# Secrets: none. GITHUB_TOKEN pushes the image (packages: write) and creates the release
# (contents: write); id-token: write is granted only to the signing job.
#
# Copyright 2026 Janghoon Lee (Redrob) and contributors. Apache-2.0.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version for a dry run, e.g. 0.2.0-rc.1 (builds, publishes nothing)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel a half-published release

env:
  IMAGE: ghcr.io/redrob-labs/redrob-os
  # renovate: datasource=docker depName=quay.io/centos-bootc/bootc-image-builder
  BIB: quay.io/centos-bootc/bootc-image-builder@sha256:30e7eac70b6e4448da57aaff66d6a89dbd1526572e8b77be31da129e692eb3e9 # latest, 2026-10-18

jobs:
  version:
    name: Resolve the version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            v="${GITHUB_REF_NAME#v}"; publish=true
          elif [ -n "$INPUT_VERSION" ]; then
            v="${INPUT_VERSION#v}"; publish=false
          else
            echo "::error::not a tag push and no version input"; exit 1
          fi
          case "$v" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$v' is not X.Y.Z[-suffix]"; exit 1 ;;
          esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          echo "version $v (publish=$publish)"

  build:
    name: build ${{ matrix.arch }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64 # EXPERIMENTAL
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    env:
      VER: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Build args from image/base.env
        id: meta
        run: |
          set -euo pipefail
          args=""
          while IFS= read -r line; do
            case "$line" in ''|'#'*) continue ;; esac
            args="$args --build-arg ${line}"
          done < image/base.env
          echo "args=$args" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        run: echo "${{ github.token }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: podman build
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          podman build \
            ${{ steps.meta.outputs.args }} \
            --build-arg GIT_SHA="${GITHUB_SHA}" \
            --build-arg VERSION="${VER}" \
            --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --label org.opencontainers.image.version="${VER}" \
            --label org.opencontainers.image.title="Redrob OS" \
            -f image/Containerfile \
            -t "${IMAGE}:${VER}-${{ matrix.arch }}" \
            .
      - name: bootc container lint
        run: podman run --rm "${IMAGE}:${VER}-${{ matrix.arch }}" bootc container lint
      - name: Push the per-arch image
        run: podman push "${IMAGE}:${VER}-${{ matrix.arch }}"

  manifest:
    name: manifest + sign
    needs: [version, build]
    if: always() && !cancelled() && needs.version.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless
    env:
      VER: ${{ needs.version.outputs.version }}
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Log in to GHCR
        run: echo "${{ github.token }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Assemble ${{ needs.version.outputs.version }} from the per-arch images that exist
        run: |
          set -euo pipefail
          podman manifest create redrob-os
          for arch in amd64 arm64; do
            if skopeo inspect --raw "docker://${IMAGE}:${VER}-${arch}" >/dev/null 2>&1; then
              podman manifest add redrob-os "docker://${IMAGE}:${VER}-${arch}"
              echo "added ${arch}"
            elif [ "$arch" = amd64 ]; then
              echo "::error::${IMAGE}:${VER}-amd64 not found -- amd64 is required"; exit 1
            else
              echo "::warning::${IMAGE}:${VER}-${arch} not found -- experimental ${arch} did not build; releasing without it"
            fi
          done
          podman manifest push --all --digestfile digest.txt redrob-os "docker://${IMAGE}:${VER}"
          echo "DIGEST=$(cat digest.txt)" >> "$GITHUB_ENV"
      - name: cosign sign (key for devices + keyless)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ""
        run: |
          set -euo pipefail
          # Key signature: what devices verify (/etc/containers/policy.json + redrob-os.pub).
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${DIGEST}"
          # Keyless signature in addition, for humans running `cosign verify`.
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}" >/dev/null
          echo "signed ${IMAGE}:${VER} @ ${DIGEST}"

  iso:
    name: installer ISO (x86_64)
    needs: [version, manifest]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    env:
      VER: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Pull the released image into root storage (bootc-image-builder reads it from there)
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman pull --arch amd64 "${IMAGE}:${VER}"
      - name: bootc-image-builder --type anaconda-iso
        # image/installer/config.toml is owned by the installer agent (Anaconda kickstart bits,
        # users, locale, LUKS defaults). See docs/ci.md.
        run: |
          set -euo pipefail
          mkdir -p output
          sudo podman run --rm --privileged --security-opt label=type:unconfined_t \
            -v "$PWD/image/installer/config.toml:/config.toml:ro" \
            -v "$PWD/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "${BIB}" \
            --type anaconda-iso \
            --config /config.toml \
            --chown "$(id -u):$(id -g)" \
            "${IMAGE}:${VER}"
          ls -la output/bootiso
          mv output/bootiso/install.iso "redrob-os-${VER}-linux-x86_64.iso"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-iso-x86_64
          path: redrob-os-${{ needs.version.outputs.version }}-linux-x86_64.iso
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  raw:
    name: raw disk image (aarch64, experimental)
    needs: [version, manifest]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    env:
      VER: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Pull the released image into root storage
        run: |
          set -euo pipefail
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman pull --arch arm64 "${IMAGE}:${VER}"
      - name: bootc-image-builder --type raw
        run: |
          set -euo pipefail
          mkdir -p output
          sudo podman run --rm --privileged --security-opt label=type:unconfined_t \
            -v "$PWD/image/installer/config.toml:/config.toml:ro" \
            -v "$PWD/output:/output" \
            -v /var/lib/containers/storage:/var/lib/containers/storage \
            "${BIB}" \
            --type raw \
            --config /config.toml \
            --chown "$(id -u):$(id -g)" \
            "${IMAGE}:${VER}"
          ls -la output/image
          xz -T0 -9 --stdout output/image/disk.raw > "redrob-os-${VER}-linux-aarch64.img.xz"
          rm -f output/image/disk.raw
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-raw-aarch64
          path: redrob-os-${{ needs.version.outputs.version }}-linux-aarch64.img.xz
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    name: GitHub Release
    needs: [version, manifest, iso, raw]
    # Publish on a tag when the ISO exists; the aarch64 raw image is optional (experimental).
    if: >-
      always() && !cancelled()
      && needs.version.outputs.publish == 'true'
      && needs.manifest.result == 'success'
      && needs.iso.result == 'success'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VER: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: SHA256SUMS
        working-directory: dist
        run: |
          set -euo pipefail
          ls -la
          sha256sum redrob-os-* > SHA256SUMS
          cat SHA256SUMS
      - name: Release notes
        run: |
          set -euo pipefail
          {
            echo "Image: \`${IMAGE}:${VER}\` (cosign-signed, GitHub OIDC)."
            echo
            echo "- \`redrob-os-${VER}-linux-x86_64.iso\` -- installer for PCs (Anaconda)"
            if [ -f "dist/redrob-os-${VER}-linux-aarch64.img.xz" ]; then
              echo "- \`redrob-os-${VER}-linux-aarch64.img.xz\` -- raw disk image for aarch64 boards (experimental)"
            else
              echo "- aarch64 raw image: not produced for this release (experimental target failed)"
            fi
            echo
            echo "Verify: \`sha256sum -c SHA256SUMS\`. Installed systems update themselves from the image above."
          } > notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: Redrob OS v${{ needs.version.outputs.version }}
          body_path: notes.md
          files: dist/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          make_latest: ${{ !contains(needs.version.outputs.version, '-') }}
