# Build, sign and publish the Redrob OS bootc image to ghcr.io/redrob-labs/redrob-os.
#
# Runs on:
#   - push to main            the merge of a release or hotfix pull request
#   (no schedule: Janghoon declined a weekly rebuild. Base-image security refreshes reach
#    devices when a Renovate PR bumps the base pin or when a release/hotfix lands on main;
#    `workflow_dispatch` rebuilds on demand.)
#   - workflow_dispatch       a manual rebuild
#
# Shape: one native build per architecture (amd64 on ubuntu-24.04, arm64 on ubuntu-24.04-arm --
# no qemu, a Rust compile under emulation takes hours), each pushed under an arch-suffixed tag;
# then one `manifest` job stitches the architectures into a manifest list, retags it
# `stable`, `<BASE_TAG>` (44) and `sha-<short>`, and cosign-signs the manifest digest keylessly
# (GitHub OIDC; devices verify against the GitHub Actions issuer in containers-policy.json).
#
# arm64 is EXPERIMENTAL: its job may fail (it is not continue-on-error, so the run is red) but the
# manifest job still publishes amd64 alone. Remove the `arm64` branch of the manifest job's
# condition once arm64 is a supported target.
#
# Secrets: none. GITHUB_TOKEN with packages: write pushes to GHCR; id-token: write lets cosign
# obtain a Fulcio certificate.
#
# Copyright 2026 Janghoon Lee (Redrob) and contributors. Apache-2.0.

name: build-image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/redrob-labs/redrob-os
  SANDBOX_IMAGE: ghcr.io/redrob-labs/redrob-sandbox

jobs:
  build:
    name: build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64 # EXPERIMENTAL -- see header
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    outputs:
      short: ${{ steps.meta.outputs.short }}
      base_tag: ${{ steps.meta.outputs.base_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Metadata and build args from image/base.env
        id: meta
        run: |
          set -euo pipefail
          args=""
          while IFS= read -r line; do
            case "$line" in ''|'#'*) continue ;; esac
            args="$args --build-arg ${line}"
            case "$line" in BASE_TAG=*) echo "base_tag=${line#BASE_TAG=}" >> "$GITHUB_OUTPUT" ;; esac
          done < image/base.env
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: podman build
        # Context = repository root, Containerfile = image/Containerfile (docs/ci.md, "Contract
        # with the Containerfile"). The agent is compiled inside the Containerfile's
        # `FROM rust AS redrob-build` stage from agent/.
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          podman build \
            ${{ steps.meta.outputs.args }} \
            --build-arg GIT_SHA="${GITHUB_SHA}" \
            --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --label org.opencontainers.image.title="Redrob OS" \
            -f image/Containerfile \
            -t "${IMAGE}:sha-${{ steps.meta.outputs.short }}-${{ matrix.arch }}" \
            .

      - name: bootc container lint
        run: podman run --rm "${IMAGE}:sha-${{ steps.meta.outputs.short }}-${{ matrix.arch }}" bootc container lint

      - name: Push the per-arch image
        run: podman push "${IMAGE}:sha-${{ steps.meta.outputs.short }}-${{ matrix.arch }}"

  sandbox:
    # The agent's task sandbox (image/sandbox/Containerfile). Built next to the OS image
    # because the OS image logically binds ghcr.io/redrob-labs/redrob-sandbox:stable and a
    # bound image that does not exist in the registry makes `bootc upgrade` fail.
    name: sandbox ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64 # EXPERIMENTAL -- see header
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: podman build (context = repository root)
        run: |
          set -euo pipefail
          podman build \
            --build-arg TARGETARCH="${{ matrix.arch }}" \
            --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            -f image/sandbox/Containerfile \
            -t "${SANDBOX_IMAGE}:sha-${GITHUB_SHA::7}-${{ matrix.arch }}" \
            .

      - name: Smoke test (tools present)
        run: |
          podman run --rm "${SANDBOX_IMAGE}:sha-${GITHUB_SHA::7}-${{ matrix.arch }}" \
            sh -c 'git --version && python3 --version && node --version && redrob-code --version || redrob-code --help | head -n 3'

      - name: Push the per-arch image
        run: podman push "${SANDBOX_IMAGE}:sha-${GITHUB_SHA::7}-${{ matrix.arch }}"

  manifest:
    name: manifest + sign
    needs: build
    # Publish as long as amd64 built; arm64 is experimental and may be missing.
    if: always() && !cancelled() && needs.build.outputs.short != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless (Fulcio) -- the only job that needs it
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Assemble the manifest list from the per-arch images that exist
        id: assemble
        env:
          SHORT: ${{ needs.build.outputs.short }}
          BASE_TAG: ${{ needs.build.outputs.base_tag }}
        run: |
          set -euo pipefail
          podman manifest create redrob-os
          for arch in amd64 arm64; do
            if skopeo inspect --raw "docker://${IMAGE}:sha-${SHORT}-${arch}" >/dev/null 2>&1; then
              podman manifest add redrob-os "docker://${IMAGE}:sha-${SHORT}-${arch}"
              echo "added ${arch}"
            elif [ "$arch" = amd64 ]; then
              echo "::error::${IMAGE}:sha-${SHORT}-amd64 not found -- amd64 is required"; exit 1
            else
              echo "::warning::${IMAGE}:sha-${SHORT}-${arch} not found -- experimental ${arch} build did not finish; publishing without it"
            fi
          done
          podman manifest inspect redrob-os
          echo "tags=stable ${BASE_TAG} sha-${SHORT}" >> "$GITHUB_OUTPUT"

      - name: Push stable, ${{ needs.build.outputs.base_tag }}, sha-${{ needs.build.outputs.short }}
        id: push
        run: |
          set -euo pipefail
          digest=""
          for tag in ${{ steps.assemble.outputs.tags }}; do
            podman manifest push --all --digestfile digest.txt redrob-os "docker://${IMAGE}:${tag}"
            digest="$(cat digest.txt)"
            echo "pushed ${IMAGE}:${tag} -> ${digest}"
          done
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: cosign sign (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ""
        run: |
          set -euo pipefail
          # Key signature: what devices verify (/etc/containers/policy.json + redrob-os.pub).
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${IMAGE}@${DIGEST}"
          # Keyless signature in addition, for humans running `cosign verify`.
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${IMAGE}@${DIGEST}" >/dev/null
          echo "signed and verified ${IMAGE}@${DIGEST}"

  manifest-sandbox:
    name: sandbox manifest + sign
    needs: [sandbox, build]
    if: always() && !cancelled() && needs.build.outputs.short != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Assemble, push (stable, sha-<short>) and sign
        env:
          SHORT: ${{ needs.build.outputs.short }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ""
        run: |
          set -euo pipefail
          podman manifest create redrob-sandbox
          for arch in amd64 arm64; do
            if skopeo inspect --raw "docker://${SANDBOX_IMAGE}:sha-${SHORT}-${arch}" >/dev/null 2>&1; then
              podman manifest add redrob-sandbox "docker://${SANDBOX_IMAGE}:sha-${SHORT}-${arch}"
            elif [ "$arch" = amd64 ]; then
              echo "::error::${SANDBOX_IMAGE}:sha-${SHORT}-amd64 not found -- amd64 is required"; exit 1
            else
              echo "::warning::${SANDBOX_IMAGE}:sha-${SHORT}-${arch} not found -- publishing without it"
            fi
          done
          digest=""
          for tag in stable "sha-${SHORT}"; do
            podman manifest push --all --digestfile digest.txt redrob-sandbox "docker://${SANDBOX_IMAGE}:${tag}"
            digest="$(cat digest.txt)"
            echo "pushed ${SANDBOX_IMAGE}:${tag} -> ${digest}"
          done
          # Key signature: what devices verify (/etc/containers/policy.json + redrob-os.pub).
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${SANDBOX_IMAGE}@${digest}"
          # Keyless signature in addition, for humans running `cosign verify`.
          cosign sign --yes "${SANDBOX_IMAGE}@${digest}"
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${SANDBOX_IMAGE}@${digest}" >/dev/null
          echo "signed and verified ${SANDBOX_IMAGE}@${digest}"
