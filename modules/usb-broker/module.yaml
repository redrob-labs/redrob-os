name: usb-broker
version: 0.0.1
description: Default-deny for new USB devices (kernel authorized_default), user approval over /run/redrob/usb.sock, BadUSB rejection, read-only automount under /run/media/redrob.
capabilities:
  - storage
devices:
  - subsystem: usb
  - subsystem: block
    attrs:
      removable: "1"
policy:
  default: block            # authorized_default=0 on every host controller
  mount: read-only          # after approval
  write: per-task           # agent writes need per-task approval
  badusb: reject            # storage device that also presents an HID interface
network: none
host_access: none
approval: per-device
