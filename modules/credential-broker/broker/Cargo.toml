[package]
name = "redrob-broker"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Redrob OS credential broker: holds tokens outside the sandbox, serves scoped calls, audits egress"
publish = false

[lib]
name = "redrob_broker"
path = "src/lib.rs"

[[bin]]
name = "redrob-broker"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8.8", default-features = false, features = ["http1", "json", "tokio", "query", "macros"] }
chacha20poly1305 = "0.10.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hex = "0.4.3"
rand = "0.8.5"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "signal"] }
toml = "0.8.23"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }

[dev-dependencies]
tempfile = "3.23"
hyper = { version = "1.7", features = ["server", "http1"] }
hyper-util = { version = "0.1.17", features = ["tokio"] }
http-body-util = "0.1.3"
