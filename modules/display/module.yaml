name: display
version: 0.1.0
description: Kiosk (agent dashboard drawn straight to KMS, no compositor) or full Wayland desktop later. Sole holder of /dev/dri and /dev/input.
capabilities:
  - display
  - input
devices:
  - subsystem: drm
  - subsystem: input
modes:
  - headless   # default, module skipped (mode file absent or not "kiosk")
  - kiosk      # redrob-display: KMS dumb-buffer dashboard, grabs all evdev devices
  - desktop    # planned: cage/wlroots session, needs Mesa in the image
network: none
host_access: none
approval: once
