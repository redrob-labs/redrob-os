name: local-inference
version: 0.0.1
description: llama.cpp router model (~1B) for intent classification, tool choice and escalation to a remote model. Offline fallback.
capabilities:
  - accelerator
devices:
  - subsystem: pci
    vendor: hailo                     # AI HAT+ 2
backends:
  # Router LLM (~1B) backends. Hailo is intentionally NOT here: Hailo-8 is a
  # quantized-CNN vision accelerator, not an LLM engine, and its Dataflow
  # Compiler is x86-only. See docs/open-questions.md Q3.
  - cpu                               # always available (llama.cpp)
  - remote-gpu                        # tailnet GPU box
vision_backends:
  # Hailo accelerates vision/CNN models (e.g. YOLO) only. HEF models are
  # cross-compiled on an x86 dev machine and dropped into models_dir; the Pi
  # only runs inference (HailoRT).
  - cpu
  - hailo                             # when the AI HAT+ accelerator is present
# Redrob OS (bootc image): /var/lib/redrob/inference/models, provisioned
# separately from OS updates (bootc keeps /var). Buildroot image: /mnt/data/redrob/models.
models_dir: /var/lib/redrob/inference/models
# Serve, on 127.0.0.1:8081 with model alias "router"; the agent reaches it as the
# `llamacpp.router` fallback provider (image/agent/etc/redrob/agent.toml):
#   bootc image  -> podman quadlet image/agent/etc/containers/systemd/redrob-inference.container
#                   (upstream ghcr.io/ggml-org/llama.cpp server image, pinned by
#                   digest). Off by default; on when /var/lib/redrob/inference/enabled
#                   and models/router.gguf exist. See README.md here.
#   Buildroot     -> the supervisor (modules/local-inference/supervisor) runs
#                   /usr/bin/llama-server (deploy/config/local-inference.toml).
enabled_flag: /var/lib/redrob/inference/enabled
model_file: router.gguf
network:
  - "100.64.0.0/10"                   # tailnet only, for remote-gpu
host_access: none
approval: auto
