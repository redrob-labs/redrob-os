#
# Anaconda profile for Redrob OS.
#
# Anaconda picks a profile by matching /etc/os-release of the system it runs
# from (os_id / variant_id), so this file is keyed to the ID the branding
# overlay sets (ID=redrob-os). It inherits everything else from the Fedora KDE
# atomic profile shipped with Anaconda.
#
# Where it takes effect: only when Anaconda runs FROM our image, i.e. the
# `bootc-installer` ISO type of the unified image-builder, where the installer
# environment is our own container. The legacy bootc-image-builder
# `anaconda-iso` type assembles its installer root from Fedora packages, so
# there this file is inert and the only effective knobs are the kickstart in
# config.toml. On the installed system Anaconda is not present; the file is
# harmless.

[Profile]
profile_id = redrob-os
base_profile = fedora-kinoite

[Profile Detection]
os_id = redrob-os

[Storage]
# Same shape as the base image: btrfs with /, /home and /var subvolumes.
default_scheme = BTRFS
default_partitioning =
    / (min 1 GiB, max 70 GiB)
    /home (min 512 MiB, free 50 GiB)
    /var (btrfs)
luks_version = luks2

[Storage Constraints]
# Redrob OS does not recommend swap partitions (zram is on by default).
swap_is_recommended = False

[User Interface]
# A bootc install has no package selection, and root login is disabled: hide
# those two screens. Keep Language, Keyboard, Time, Network, Storage and User.
hidden_spokes =
    SoftwareSelectionSpoke
    PasswordSpoke
hidden_webui_pages =
    anaconda-screen-software
can_change_root = False
can_change_users = True
# Reasonable minimum: 8 characters, no quality gate so family machines are not
# blocked by libpwquality. LUKS passphrase keeps the stricter default.
password_policies =
    root (quality 1, length 8)
    user (quality 1, length 8)
    luks (quality 1, length 8)

[Localization]
# Pre-select the language from the network location when available (Korea ->
# 한국어); the Welcome screen still lets the user change it.
use_geolocation = True
