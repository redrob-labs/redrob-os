# containers.conf override for podman.service (the agent's task sandbox).
# Loaded via CONTAINERS_CONF_OVERRIDE from podman.service.d/50-redrob-sandbox.conf;
# it applies on top of /usr/share/containers/containers.conf and /etc/containers/*
# for that service only. Nothing here reaches quadlets or rootless podman.
#
# The agent issues plain `docker run ...` (podman-docker shim) with no --runtime,
# so the runtime must be the service default.

[containers]
# gVisor does not support SELinux labels on its sandbox; with labeling on, the
# bind-mounted task workspace (/var/lib/redrob/agent/work, var_lib_t) would be
# unwritable from inside the container. runsc is the isolation boundary here.
label = false

[engine]
runtime = "runsc"

[engine.runtimes]
# The image build installs the pinned runsc (image/pins.env, RUNSC_*) under
# /usr/libexec/gvisor; the wrapper adds --host-uds=open for the broker's per-task
# egress socket. /usr/local/bin/runsc is for a hand-installed dev box.
runsc = ["/usr/libexec/redrob/runsc-sandbox", "/usr/local/bin/runsc"]
