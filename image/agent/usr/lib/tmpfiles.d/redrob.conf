# Redrob OS state root (systemd-tmpfiles, every boot). Replaces Buildroot's
# redrob-state-dirs.service: on bootc the users exist (sysusers) before tmpfiles
# runs, so ownership by name is reliable here. Nothing under /var is in the image;
# bootc keeps /var persistent across updates and rollbacks.
#
# Type Path                                   Mode User           Group          Age Argument
d      /var/lib/redrob                        0755 root           root           -
# Device identity: id is public, the ed25519 key is readable by the broker group.
d      /var/lib/redrob/identity               0755 root           root           -
# Agent (zeroclaw): config.toml + .secret_key, sqlite data, task workspace.
d      /var/lib/redrob/agent                  0750 redrob-agent   redrob-agent   -
d      /var/lib/redrob/agent/data             0700 redrob-agent   redrob-agent   -
# Task workspace (ZEROCLAW_WORKSPACE); podman bind-mounts it into sandboxes as
# /workspace (agent.toml [runtime.docker]).
d      /var/lib/redrob/agent/work             0755 redrob-agent   redrob-agent   -
# Credential broker: encrypted store + key file; audit log is user-readable.
d      /var/lib/redrob/broker                 0700 redrob-broker  redrob-broker  -
d      /var/lib/redrob/audit                  0750 redrob-broker  redrob-broker  -
# USB broker (root): policy.json.
d      /var/lib/redrob/usb                    0755 root           root           -
# Local inference: GGUF models, provisioned separately from OS updates.
# `touch /var/lib/redrob/inference/enabled` turns the quadlet on.
d      /var/lib/redrob/inference              0755 root           root           -
d      /var/lib/redrob/inference/models       0755 root           root           -
# Sockets: broker.sock (redrob-broker) and usb.sock (root, chgrp redrob-broker).
# Owned by the broker so its RuntimeDirectory= does not fight the usb broker.
d      /run/redrob                            0750 redrob-broker  redrob-broker  -
