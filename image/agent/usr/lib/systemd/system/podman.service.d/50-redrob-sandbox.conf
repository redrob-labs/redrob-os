# Redrob task sandbox: the agent's containers run through the root podman API
# service with gVisor (runsc) as the OCI runtime. CONTAINERS_CONF_OVERRIDE scopes
# that default to podman.service ONLY -- quadlets (redrob-inference.container run
# `podman run` from their own unit) and users' rootless podman/toolbox keep crun.
[Service]
Environment=CONTAINERS_CONF_OVERRIDE=/etc/redrob/containers-sandbox.conf
