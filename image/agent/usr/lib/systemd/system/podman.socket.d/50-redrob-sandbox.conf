# /run/podman/podman.sock is reachable by group redrob-sandbox (only redrob-agent
# is a member; sysusers.d/redrob.conf). Holding this socket is root-equivalent on
# the host: the gVisor runtime is the boundary for the TASKS the agent runs, the
# agent process itself is trusted with the socket. Keep the membership list short.
[Socket]
SocketGroup=redrob-sandbox
SocketMode=0660
