# Redrob OS service accounts (systemd-sysusers, runs on every boot before tmpfiles).
# Replaces the Buildroot REDROB_*_USERS tables. Home directories live under
# /var/lib/redrob, which bootc keeps persistent across image updates.
#
# Type Name           ID  GECOS                               Home                    Shell
u      redrob-agent   -   "Redrob agent runtime"              /var/lib/redrob/agent   /usr/sbin/nologin
u      redrob-broker  -   "Redrob credential broker"          /var/lib/redrob/broker  /usr/sbin/nologin
# Owners of the podman API socket the agent's task sandbox talks to
# (podman.socket drop-in sets SocketGroup=redrob-sandbox). Access to that socket
# is root-equivalent on the host; only redrob-agent is a member.
g      redrob-sandbox -
m      redrob-agent   redrob-broker
m      redrob-agent   redrob-sandbox
