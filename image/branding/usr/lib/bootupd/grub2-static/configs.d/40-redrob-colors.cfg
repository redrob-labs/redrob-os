# Redrob OS boot menu colours (redrob-ui tokens, nearest GRUB VGA colour).
# Copyright 2026 Janghoon Lee (Redrob) and contributors. Apache-2.0.
#
# bootupd concatenates /usr/lib/bootupd/grub2-static/configs.d/*.cfg into the
# static /boot/grub2/grub.cfg when it installs the boot loader (bootc install /
# Anaconda). GRUB's text menu knows only the 16 VGA colours, so each token maps
# to the nearest one:
#   background  Redrob Black #0A0B0C  -> black
#   text        gray-5 (deep ground)  -> light-gray
#   selection   Redrob Blue #2B52FF   -> blue (the 8 console background colours
#               have no lighter blue), white text on it
set color_normal=light-gray/black
set menu_color_normal=light-gray/black
set menu_color_highlight=white/blue
