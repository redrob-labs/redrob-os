# Copyright 2026 Janghoon Lee (Redrob) and contributors. Apache-2.0.
#
# Kinoite 44 ships plasma-login-manager (the KWin-based SDDM successor), NOT
# SDDM, so /etc/sddm.conf.d is never read (seen on the v0.2.6 QEMU install:
# stock Plasma wallpaper on the login screen). PLM reads this file as the
# distro layer and /etc/plasmalogin.conf as the admin/KCM layer on top; the
# greeter's colours come from the `plasmalogin` user's kdeglobals, which falls
# back to /etc/xdg/kdeglobals (ColorScheme=Redrob, installer overlay).
# Wallpaper config path format: [Greeter][Wallpaper][<plugin id>][General].

[Greeter]
WallpaperPluginId=org.kde.image
ShowClock=true

[Greeter][Wallpaper][org.kde.image][General]
Image=file:///usr/share/wallpapers/Redrob
FillMode=2
