# Redrob desktop settings (system default). Copy to ~/.config/redrob/desktop.conf
# to change your own; redrob-comp re-reads it live.
#
# style: mac (top bar, floating dock, Command-key shortcuts)
#      | windows (bottom taskbar, start button, Windows-key shortcuts)
style = mac
theme = dark

[shortcuts]
# Added on top of the style's own set. "none" removes one. Examples:
# Super+Return = terminal
# Alt+F4 = none
# Actions: close cycle launcher show-desktop maximize restore snap-left
#          snap-right terminal files browser settings toggle-theme
