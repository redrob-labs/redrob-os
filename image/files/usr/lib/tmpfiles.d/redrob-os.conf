# (Named redrob-os.conf: image/agent ships its own redrob.conf, which used to
# replace this file on the image.)
# Redrob OS machine-state directories. /var is empty in the image (bootc rule);
# everything under it is created here on boot. See tmpfiles.d(5).
#Type Path                  Mode UID  GID  Age Argument
d     /var/lib/redrob       0755 root root -   -
d     /var/opt              0755 root root -   -

# greetd's greeter (redrob-comp --greeter) keeps the last user here.
d /var/lib/greetd 0750 greetd greetd -
