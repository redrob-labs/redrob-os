# Redrob OS: run the bootc update check once a day at 03:00 local time, spread
# over two hours so a fleet does not hit the registry at once, and catch up after
# the machine was off. Overrides the upstream OnBootSec/OnUnitInactiveSec cadence.
[Timer]
OnBootSec=
OnUnitInactiveSec=
OnCalendar=*-*-* 03:00:00
RandomizedDelaySec=2h
Persistent=true
