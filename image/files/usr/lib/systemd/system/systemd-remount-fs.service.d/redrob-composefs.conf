# Redrob OS: the ostree/composefs root is an immutable overlay, so remounting /
# from the fstab Anaconda writes always fails ("overlay: No changes allowed in
# reconfigure", seen on every v0.2.x boot). ostree-remount.service is what makes
# /etc, /var and /sysroot writable on this OS, so skipping this unit loses nothing.
# Copyright 2026 Janghoon Lee (Redrob) and contributors. Apache-2.0.
[Unit]
ConditionPathExists=!/run/ostree-booted
