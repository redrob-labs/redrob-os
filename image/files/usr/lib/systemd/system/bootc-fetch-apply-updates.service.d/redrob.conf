# Redrob OS: STAGE the update only. Upstream runs `bootc upgrade --apply`, which
# reboots the machine the moment a new image is fetched -- unacceptable on a desktop
# someone may be using at 03:00. The staged deployment becomes active on the next
# normal reboot/shutdown; greenboot then validates it and rolls back if it fails.
[Service]
ExecStart=
ExecStart=/usr/bin/bootc upgrade
