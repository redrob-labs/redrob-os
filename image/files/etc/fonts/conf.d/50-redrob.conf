<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Redrob OS typography (Redrob Group Design System 30-typography.md / 35-korean.md).
  Copyright 2026 Janghoon Lee (Redrob) and contributors. Apache-2.0.

  Pretendard is the Latin system face and Wanted Sans the Korean one; they are
  installed by image/scripts/25-fonts.sh. Pretendard has no Hangul, so a request
  for "Pretendard" (the family named in /etc/xdg/kdeglobals) falls through to
  Wanted Sans for Korean text, and both stand in front of the generic sans-serif.
  Nanum Myeongjo (Fedora naver-nanum-fonts) is the Korean serif voice face.
  Shipped at 50- so its <prefer> lists are inserted before Fedora's
  56-/57-google-noto-* aliases: an earlier file's preferred family wins
  (seen on the v0.3.0 install: at 60- `fc-match sans-serif` gave Noto Sans).
-->
<fontconfig>
  <alias binding="strong">
    <family>Pretendard</family>
    <prefer>
      <family>Pretendard</family>
      <family>Wanted Sans</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>Wanted Sans</family>
    <prefer>
      <family>Wanted Sans</family>
      <family>Pretendard</family>
    </prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Pretendard</family>
      <family>Wanted Sans</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>NanumMyeongjo</family>
    </prefer>
  </alias>
  <!-- Korean locale: Wanted Sans first, so Latin inside Korean lines matches its weight. -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>ko</string></test>
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Wanted Sans</string>
    </edit>
  </match>
</fontconfig>
